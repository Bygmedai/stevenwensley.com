name: Quality Gate

# stevenwensley.com efter oprydningen 4/11 2026 (S639): Eleventy bygger src → _site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build publish directory
        run: node scripts/build-publish.mjs
      - name: Unit tests on the build
        run: node --test tests/*.unit.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          npx http-server _site -p 8080 -s &
          sleep 2
          npx playwright test tests/smoke.spec.js tests/ny.spec.js --reporter=list
        env:
          BASE_URL: http://localhost:8080
