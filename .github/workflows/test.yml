name: Quality Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  build-verify:
    name: Eleventy Build Verify
    # Re-runs `npm run build` and fails if the committed /insights/*.html
    # files differ from the freshly built output. This catches "dev forgot
    # to run build before commit" — the canonical source is /src/ and the
    # /insights/*.html files are committed build artefacts (so GitHub
    # Pages can serve them directly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Verify committed /insights/ matches build output
        run: |
          if ! git diff --exit-code --stat insights/; then
            echo "::error::Committed /insights/*.html differs from npm run build output."
            echo "Run 'npm run build' locally and commit the result."
            exit 1
          fi

  publish-verify:
    name: Publish Directory Verify
    # Cloudflare Pages deploys ./_site, assembled by scripts/build-publish.mjs.
    # The script fails if a required file is missing from the output, or if
    # source/tooling that must never ship reappears in it. This job runs it so
    # a new root-level tool cannot leak into the published site unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Assemble publish directory
        run: node scripts/build-publish.mjs
      # sitemap.xml is generated from the same inventory build-publish uses.
      # Asserting the committed file matches a fresh generation is the same
      # shape as the Eleventy check above: it fails on something true or
      # false, not on something that merely looks right. Seven articles were
      # indexable, linked and absent from the hand-maintained sitemap before
      # this gate existed.
      - name: Verify committed sitemap.xml matches a fresh generation
        run: node scripts/build-sitemap.mjs --check

  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g html-validate
      - name: Validate all HTML files
        run: |
          # Find all HTML files (skip node_modules, _site build dir, src
          # source files (which contain Nunjucks template syntax that
          # html-validate would flag), and any *backup* files).
          FILES=$(find . -name "*.html" \
            -not -path "*/node_modules/*" \
            -not -path "*/_site/*" \
            -not -path "*/src/*" \
            -not -name "*backup*" | sort)
          if [ -z "$FILES" ]; then
            echo "No HTML files found"
            exit 0
          fi
          # Run validation — exit code 0 means no errors (warnings are OK)
          html-validate $FILES

  broken-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g linkinator
      - name: Start local server
        # Not http-server: it resolves /insights to the insights/ directory and
        # 404s, while GitHub Pages and Cloudflare Pages both resolve it to
        # insights.html. serve-static.mjs applies production's resolution order,
        # so the link checker tests the URLs the site actually serves.
        run: |
          node scripts/serve-static.mjs . 8080 &
          sleep 2
      - name: Check internal links
        run: |
          # Most internal links on this site are absolute (https://stevenwensley.com/...)
          # because the tool pages are served from the project root. The old skip
          # pattern excluded everything that was not localhost, so every one of those
          # links went unchecked — the crawl reached 63 URLs and validated almost no
          # internal navigation. A dead /contact.html link survived in the footer of
          # all ten insight articles that way.
          #
          # Rewriting the production origin to the local server makes those links
          # resolve against the build under test, and the skip pattern now lets both
          # forms through while still keeping genuinely external hosts out of CI.
          # Coverage goes from 63 to 137 links.
          linkinator http://localhost:8080 --recurse \
            --url-rewrite-search "https://stevenwensley\.com" \
            --url-rewrite-replace "http://localhost:8080" \
            --skip "^(?!http://localhost|https://stevenwensley\.com)" \
            --format json --timeout 10000 > link-report.json || true
          python3 -c "
          import json, sys
          data = json.load(open('link-report.json'))
          links = data.get('links', data) if isinstance(data, dict) else data
          if isinstance(links, dict):
              links = links.get('links', [])
          broken = [l for l in links if isinstance(l, dict) and l.get('status', 0) >= 400]
          if broken:
              for l in broken:
                  print(f'  {l.get(\"status\",\"?\")} {l.get(\"url\",\"?\")}')
              print(f'::error::Found {len(broken)} broken links')
              sys.exit(1)
          else:
              print('No broken links found')
          "

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g @lhci/cli
      - name: Start local server
        run: |
          node scripts/serve-static.mjs . 8080 &
          sleep 2
      - name: Run Lighthouse on key pages
        run: |
          # Curated list spanning landing, services, insights hub, one article and one tool
          PAGES=(
            "http://localhost:8080/index.html"
            "http://localhost:8080/services.html"
            "http://localhost:8080/insights.html"
            "http://localhost:8080/insights/ai-governance-starter-kit.html"
            "http://localhost:8080/ai-governance-assessment.html"
            "http://localhost:8080/book-session.html"
          )
          if [ ${#PAGES[@]} -eq 0 ]; then
            echo "No HTML pages found for Lighthouse"
            exit 0
          fi
          FAILED=0
          for URL in "${PAGES[@]}"; do
            PAGE=$(echo "$URL" | sed 's|.*/||')
            echo "=== Testing $PAGE ==="
            lhci collect --url="$URL" --settings.chromeFlags="--no-sandbox --headless" || true
            REPORT=$(ls -t .lighthouseci/lhr-*.json 2>/dev/null | head -1)
            if [ -f "$REPORT" ]; then
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          cats = data.get('categories', {})
          a11y = int(cats.get('accessibility', {}).get('score', 0) * 100)
          seo = int(cats.get('seo', {}).get('score', 0) * 100)
          print(f'  Accessibility: {a11y} | SEO: {seo}')
          failed = []
          if a11y < 80: failed.append(f'Accessibility {a11y} < 80')
          if seo < 80: failed.append(f'SEO {seo} < 80')
          if failed:
              for f in failed: print(f'  ::warning::{f}')
              sys.exit(1)
          " "$REPORT"
              if [ $? -ne 0 ]; then FAILED=1; fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more pages failed Lighthouse gates"
            exit 1
          fi

  playwright:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install chromium --with-deps
      - name: Start local server
        run: |
          node scripts/serve-static.mjs . 8080 &
          sleep 2
      - name: Run smoke tests
        run: npx playwright test tests/ --reporter=list
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: tests/screenshots/
          retention-days: 7
