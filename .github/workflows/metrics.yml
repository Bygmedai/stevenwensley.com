name: Refresh factory metrics

# The commit and pull-request counts on the site went a month stale because
# keeping them current depended on someone remembering. This runs weekly,
# measures the org, writes the numbers into the pages and commits the result —
# which redeploys the site through Cloudflare Pages like any other push.
#
# Requires the FACTORY_METRICS_TOKEN secret: a fine-grained PAT with read-only
# access to the Bygmedai organisation including private repositories. Without
# it the fetch step exits cleanly and nothing changes, so the workflow is safe
# to merge before the secret exists.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  # Runs when this workflow file itself lands on main. That makes merging the
  # change the test of the change: the token, the scopes, the API calls and the
  # commit step all get exercised immediately, instead of the first real
  # evidence arriving on a Monday six days later.
  #
  # No loop risk. The commit this workflow makes touches metrics.json, the
  # pages and sitemap.xml — never this file — so it cannot retrigger itself.
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  refresh:
    name: Measure and propagate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check the secret is present
        # Named separately so the answer to "is the token wired up?" is visible
        # in the job list without opening a log.
        run: |
          if [ -z "${{ secrets.FACTORY_METRICS_TOKEN }}" ]; then
            echo "::warning::FACTORY_METRICS_TOKEN is not set — the run will change nothing."
            echo "secret=absent" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FACTORY_METRICS_TOKEN is set."
            echo "secret=present" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Measure the organisation
        env:
          FACTORY_METRICS_TOKEN: ${{ secrets.FACTORY_METRICS_TOKEN }}
        run: node scripts/fetch-metrics.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Propagate the numbers into the pages
        run: node scripts/update-metrics.mjs

      # The sitemap carries lastmod dates; if pages changed, it has to follow,
      # or the committed sitemap stops matching a fresh generation and the
      # Quality Gate fails on the next pull request instead of here.
      - name: Regenerate sitemap
        run: node scripts/build-sitemap.mjs

      - name: Commit if anything moved
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh factory metrics

          Automated weekly measurement via scripts/fetch-metrics.mjs.
          Method: GitHub search API, org-scoped, default branches only."
          git push
